services:
  postgres:
    image: postgres:17
    container_name: equitylens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: equitylens
      POSTGRES_USER: equitylens
      POSTGRES_PASSWORD: equitylens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
