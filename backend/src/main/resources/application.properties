spring.application.name=equitylens

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/equitylens}
spring.datasource.username=${POSTGRES_USER:equitylens}
spring.datasource.password=${POSTGRES_PASSWORD:equitylens_dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

finnhub.base-url=https://finnhub.io/api/v1
finnhub.api-key=${FINNHUB_API_KEY:}
# Set a real contact address when accessing SEC in deployment.
sec.user-agent=${SEC_USER_AGENT:EquityLens contact@example.com}

# Apply the small, idempotent PostgreSQL constraint upgrade after Hibernate creates tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/ticker-schema.sql,classpath:db/market-price-schema.sql,classpath:db/realtime-market-schema.sql
spring.sql.init.separator=^^^

# Optional: missing credentials leave the Market section unavailable, without affecting SEC data.
market.data-provider=${MARKET_DATA_PROVIDER:stashgamma}
market.stashgamma.api-key=${STASHGAMMA_API_KEY:}
market.stashgamma.base-url=https://www.stashgamma.com/api/dataapi/v1

# MCP is additive; normal dashboard REST requests never depend on it.
equitylens.mcp.enabled=${MCP_ENABLED:true}
equitylens.mcp.allowed-hosts=${MCP_ALLOWED_HOSTS:localhost:*,127.0.0.1:*}
equitylens.mcp.allowed-origins=${MCP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
equitylens.ai.enabled=${AI_ENABLED:true}
equitylens.ai.provider=${AI_PROVIDER:local}
equitylens.ai.local.url=${AI_LOCAL_URL:http://127.0.0.1:11434}
equitylens.ai.local.model=${AI_LOCAL_MODEL:qwen2.5:7b}
# Set this to the actual backend port when overriding server.port.
equitylens.ai.mcp.url=${AI_MCP_URL:http://127.0.0.1:8080}
# Optional for local development; required for access from non-loopback clients.
equitylens.ai.access-token=${AI_ACCESS_TOKEN:}

# Optional real-time ingestion and derived live notifications. Historical APIs remain independent.
realtime.enabled=${REALTIME_ENABLED:false}
realtime.provider=${REALTIME_MARKET_PROVIDER:alpaca}
realtime.symbols=${REALTIME_SYMBOLS:}
realtime.max-symbols=${REALTIME_MAX_SYMBOLS:30}
realtime.kafka.bootstrap=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
realtime.alpaca.key=${ALPACA_API_KEY:}
realtime.alpaca.secret=${ALPACA_API_SECRET:}
realtime.alpaca.feed=${ALPACA_FEED:iex}
realtime.alpaca.url=${ALPACA_STREAM_URL:wss://stream.data.alpaca.markets/v2/${ALPACA_FEED:iex}}
realtime.alpaca.channels=${ALPACA_CHANNELS:TRADES,QUOTES,BARS}
realtime.tiingo.token=${TIINGO_API_TOKEN:}
realtime.tiingo.url=${TIINGO_STREAM_URL:wss://api.tiingo.com/iex}
realtime.tiingo.threshold=${TIINGO_THRESHOLD_LEVEL:6}
realtime.analytics.provider=${REALTIME_ANALYTICS_PROVIDER:${REALTIME_MARKET_PROVIDER:alpaca}}
realtime.analytics.feed=${REALTIME_ANALYTICS_FEED:}
realtime.analytics.synthetic=${REALTIME_ANALYTICS_SYNTHETIC:false}
realtime.live.enabled=${REALTIME_LIVE_ENABLED:false}
realtime.live.instance-id=${REALTIME_INSTANCE_ID:${random.uuid}}
