spring.application.name=equitylens

spring.datasource.url=jdbc:postgresql://localhost:5432/equitylens
spring.datasource.username=equitylens
spring.datasource.password=equitylens_dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

finnhub.base-url=https://finnhub.io/api/v1
finnhub.api-key=${FINNHUB_API_KEY:}
# Set a real contact address when accessing SEC in deployment.
sec.user-agent=${SEC_USER_AGENT:EquityLens contact@example.com}

# Apply the small, idempotent PostgreSQL constraint upgrade after Hibernate creates tables.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/ticker-schema.sql,classpath:db/market-price-schema.sql
spring.sql.init.separator=^^^

# Optional: missing credentials leave the Market section unavailable, without affecting SEC data.
market.stashgamma.api-key=${STASHGAMMA_API_KEY:}
market.stashgamma.base-url=https://www.stashgamma.com/api/dataapi/v1
